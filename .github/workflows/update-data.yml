name: Update Stock Data

on:
  schedule:
    # 每天 UTC 01:00 執行（台北時間 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write  # 允許提交和推送變更

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/stock-analysis-platform-01DxrhetChaG9XmjDPy8mz1a
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static data
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python generate_static_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet frontend/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/data/
          COMMIT_DATE=$(date '+%Y-%m-%d')
          git commit -m "data: 自動更新每日股票分析資料 ($COMMIT_DATE)"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "⚠️ 沒有檢測到資料變更，跳過提交"
